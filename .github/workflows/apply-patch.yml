name: Apply patch

on:
  push:
    branches:
      - trial-time-and-featured-expiry

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch and clean up
        run: |
          set -e
          if [ ! -f trial-time-and-featured-expiry.patch ]; then
            echo "Patch file not found, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply trial-time-and-featured-expiry.patch
          rm -f trial-time-and-featured-expiry.patch .github/workflows/apply-patch.yml
          git add -A
          git status --short
          git commit -m "Recruitment: trial time picker; Board: featured auto-expiry"
          git push
